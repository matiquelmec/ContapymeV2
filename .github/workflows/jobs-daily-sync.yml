name: 🔄 Daily Regional News & Jobs Sync

on:
  # Desactivado: El sistema web y crons automáticos fueron dados de baja.
  workflow_dispatch:

jobs:
  sync-magallanes:
    name: 🌐 Ingesta de Empleos y Noticias Magallanes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Sincronizar Empleos
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://contapymepuq.cl' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Disparando sincronización diaria de empleos en $SITE_URL/api/v1/jobs/sync..."
          curl -s -X POST "$SITE_URL/api/v1/jobs/sync" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" || echo "Jobs sync terminado con aviso"

      - name: Sincronizar Noticias Regionales
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://contapymepuq.cl' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Disparando sincronización de noticias en $SITE_URL/api/v1/news/sync..."
          curl -s -X POST "$SITE_URL/api/v1/news/sync" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "Content-Type: application/json" || echo "News sync terminado con aviso"
